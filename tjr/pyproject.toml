[project]
name = "jtjr"
version = "0.1.0"
description = "J: TJR-style liquidity-sweep strategy for index futures (rules, backtester, paper book)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pandas>=2", "pyarrow>=15"]
data = ["requests>=2.31"]
dev = ["pytest>=8", "requests>=2.31"]

[tool.setuptools.packages.find]
include = ["jtjr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
